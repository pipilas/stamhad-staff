name: Build & Release

# Every push to main: build + test everything (nothing is published).
# Push a tag like v0.7.1 (must match version.txt): build, test and publish a Release.
#
# Release files:
#   StamhadStaff-Setup.exe            Windows installer (program folder + shortcuts + uninstaller)
#   StamhadStaff-<v>-portable.exe     Windows single file, no install
#   StamhadStaff-<v>-mac.pkg          Mac installer (puts the app in Applications)
#   StamhadStaff-<v>-mac.dmg          Mac disk image (drag to Applications; also used by in-app updates)
#   SHA256SUMS.txt

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match version.txt
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version.txt ($V)"; exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tip maths tests
        run: python test_core.py
      - name: Sign-in and subscription tests (fake Firebase)
        run: python tests/test_account.py

  windows:
    needs: check
    runs-on: windows-latest
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build portable .exe
        shell: pwsh
        run: |
          pyinstaller stamhad_staff.spec --clean --noconfirm
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\StamhadStaff.exe "out\StamhadStaff-$env:V-portable.exe"
      - name: Build program folder
        shell: pwsh
        run: |
          $env:STAMHAD_ONEDIR = "1"
          pyinstaller stamhad_staff.spec --clean --noconfirm
          if (-not (Test-Path dist\StamhadStaff\StamhadStaff.exe)) { throw "program folder missing" }
      - name: Self-test (portable)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\StamhadStaff-$env:V-portable.exe" -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test hung" }
          Get-Content "$HOME\stamhad-staff-selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:V" installer\windows.iss
          if (-not (Test-Path out\StamhadStaff-Setup.exe)) { throw "installer missing" }
      - name: Test the installer (install, run, update over itself, uninstall)
        shell: pwsh
        run: |
          function Run-Setup($exe, $log) {
            $p = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log") -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "setup exit code $($p.ExitCode)" }
          }
          Run-Setup out\StamhadStaff-Setup.exe "$PWD\setup1.log"
          $dir = "$env:LOCALAPPDATA\Programs\Stamhad Staff"
          if (-not (Test-Path "$dir\StamhadStaff.exe")) { throw "not installed" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller" }
          $p = Start-Process -FilePath "$dir\StamhadStaff.exe" -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "installed app hung" }
          $t = Get-Content "$HOME\stamhad-staff-selftest.txt" -Raw; $t
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed" }
          if ($t -notmatch 'kind=win-installed') { throw "installed app doesn't know it's installed" }
          # REAL in-app update: the installed app starts Setup and quits; Setup reinstalls and reopens it
          $res = "$env:APPDATA\StamhadStaff\update-result.json"
          Remove-Item $res -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$dir\StamhadStaff.exe" -ArgumentList @('--selftest-update', "$PWD\out\StamhadStaff-Setup.exe") -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "app didn't quit for the update" }
          Get-Content "$HOME\stamhad-staff-selftest.txt"
          if ($p.ExitCode -ne 0) { throw "app couldn't start the updater" }
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $res) -and ((Get-Content $res -Raw) -match '"status": "ok"')) { $ok = $true; break }
          }
          Get-Content "$env:APPDATA\StamhadStaff\logs\setup.log" -Tail 15 -ErrorAction SilentlyContinue
          if (-not $ok) { throw "in-app update didn't finish" }
          Start-Sleep -Seconds 5
          $running = Get-Process StamhadStaff -ErrorAction SilentlyContinue
          if (-not $running) { throw "app wasn't reopened after the update" }
          $running | Stop-Process -Force
          Start-Sleep -Seconds 2
          "in-app update OK"
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\StamhadStaff.exe") { throw "uninstall left the app behind" }
          "installer OK"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/StamhadStaff-Setup.exe
            out/StamhadStaff-*-portable.exe

  mac:
    needs: check
    runs-on: macos-latest
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build
        run: pyinstaller stamhad_staff.spec --clean --noconfirm
      - name: Sign (ad-hoc) so macOS doesn't call it damaged
        run: |
          codesign --force --deep --sign - "dist/NUME.app"
          codesign --verify --deep --strict --verbose=1 "dist/NUME.app"
      - name: Self-test the built app
        run: |
          "dist/NUME.app/Contents/MacOS/StamhadStaff" --selftest & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "self-test hung"; exit 1; fi
          wait $pid; rc=$?
          cat ~/stamhad-staff-selftest.txt; exit $rc
      - name: Make the .dmg
        run: |
          mkdir -p out dmg && cp -R "dist/NUME.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "NUME" -srcfolder dmg -ov -format UDZO "out/StamhadStaff-$V-mac.dmg"
          hdiutil verify "out/StamhadStaff-$V-mac.dmg"
      - name: Make the .pkg installer
        run: |
          mkdir -p pkgroot && cp -R "dist/NUME.app" pkgroot/
          pkgbuild --analyze --root pkgroot comp.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" comp.plist
          pkgbuild --root pkgroot --component-plist comp.plist --identifier com.stamhad.staff \
                   --version "$V" --install-location /Applications --scripts installer/mac_scripts app.pkg
          productbuild --package app.pkg "out/StamhadStaff-$V-mac.pkg"
          pkgutil --payload-files "out/StamhadStaff-$V-mac.pkg" | head -5
      - name: Test the .pkg (install, owner, run)
        run: |
          sudo installer -pkg "out/StamhadStaff-$V-mac.pkg" -target /
          APP="/Applications/NUME.app"
          test -d "$APP" || { echo "not installed"; exit 1; }
          ls -ld "$APP"; owner=$(stat -f %Su "$APP"); echo "owner=$owner console=$(stat -f %Su /dev/console)"
          if [ "$owner" = "root" ]; then echo "::warning::app is owned by root (no console user on this runner?)"; fi
          "$APP/Contents/MacOS/StamhadStaff" --selftest & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "hung"; exit 1; fi
          wait $pid; rc=$?; cat ~/stamhad-staff-selftest.txt; exit $rc
      - name: Test a REAL in-app update (app quits, helper swaps it, app reopens)
        run: |
          APP="/Applications/NUME.app"
          DATA="$HOME/Library/Application Support/StamhadStaff"
          RES="$DATA/update-result.json"; rm -f "$RES"
          # failures are copied into the run summary (public), so they can be read without signing in
          fail() {
            echo "::error title=Mac in-app update::$1 || result: $(cat "$RES" 2>/dev/null) || update.log: $(tail -n 12 "$DATA/logs/update.log" 2>/dev/null | tr '\n' ' ') || selftest: $(tr '\n' ' ' < ~/stamhad-staff-selftest.txt 2>/dev/null | cut -c1-600) || apps: $(ls -ld /Applications/Stamhad* 2>&1 | tr '\n' ' ') || me: $(id -un)"
            exit 1
          }
          "$APP/Contents/MacOS/StamhadStaff" --selftest-update "$PWD/out/StamhadStaff-$V-mac.dmg" & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; fail "app didn't quit for the update"; fi
          wait $pid || fail "app couldn't start the updater"
          for i in $(seq 1 60); do grep -q '"status"' "$RES" 2>/dev/null && ! grep -q '"started"' "$RES" && break; sleep 2; done
          cat "$DATA/logs/update.log" || true
          grep -q '"status": "ok"' "$RES" || fail "in-app update didn't finish"
          sleep 5
          pgrep -fl "NUME.app" || fail "app wasn't reopened after the update"
          pkill -f "NUME.app" || true
          echo "in-app update OK"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            out/StamhadStaff-*-mac.dmg
            out/StamhadStaff-*-mac.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && ls -la && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          V=${{ needs.check.outputs.version }}
          python3 - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else "Bug fixes and improvements."
          notes += ("\n\n### Which file do I download?\n"
                    "- **Windows:** `StamhadStaff-Setup.exe` (installs it with a Start menu entry). "
                    "No-install version: `StamhadStaff-" + v + "-portable.exe`.\n"
                    "- **Mac (M1 or newer):** `StamhadStaff-" + v + "-mac.pkg` (installer) or the `.dmg` (drag to Applications).\n"
                    "\nAlready have it? The app offers this update when it opens.")
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: NUME ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: |
            out/StamhadStaff-Setup.exe
            out/StamhadStaff-*-portable.exe
            out/StamhadStaff-*-mac.dmg
            out/StamhadStaff-*-mac.pkg
            out/SHA256SUMS.txt
